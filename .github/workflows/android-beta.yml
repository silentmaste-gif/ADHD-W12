name: Android beta bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  android-beta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

        - name: Pull and validate binary assets
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          python3 - <<'PY'
          from pathlib import Path

          root = Path("flutter_app/assets")
          files = [*root.glob("*.png"), *root.glob("*.jpg"), *root.glob("*.jpeg")]
          if not files:
            raise SystemExit("No image assets found.")
          for path in files:
            data = path.read_bytes()
            if data.startswith(b"version https://git-lfs.github.com/spec/v1"):
              raise SystemExit(f"Git LFS pointer was not hydrated: {path}")
            if path.suffix.lower() == ".png" and not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit(f"Invalid PNG asset: {path}")
            if path.suffix.lower() in {".jpg", ".jpeg"} and not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit(f"Invalid JPEG asset: {path}")
          print(f"Validated {len(files)} binary image assets.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --concurrency=1

      - name: Check release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Missing Android release signing secrets."
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS."
            exit 1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=upload-keystore.jks" > android/key.properties

      - name: Build Google Play App Bundle
        run: flutter build appbundle --release

      - name: Upload beta bundle
        uses: actions/upload-artifact@v4
        with:
          name: aidhd-android-beta
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
